[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docagent"
version = "1.0.0"
description = "Agentic RAG analyst for SEC filings: LangGraph + MCP + hybrid retrieval + citation guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.6",
    "mcp>=2.3",
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-community>=0.4",
    "langchain-huggingface>=1.2",
    "sentence-transformers>=5",
    "transformers>=5",
    "torch>=2.4",
    "faiss-cpu>=1.9",
    "pymupdf>=1.25",
    "numpy>=2",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "rank-bm25>=0.2", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
include = ["docagent*"]

[tool.setuptools.package-data]
"docagent.api" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
